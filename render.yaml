services:
  - type: web
    name: lexicon-books
    env: node
    region: oregon
    branch: main
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: "production"

      - key: PORT
        value: "5000"

      - key: DATABASE_URL
        sync: false

      - key: ADMIN_DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: SESSION_SECRET
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PIN
        sync: false

      - key: ADMIN_SECRET_PATH
        sync: false

      - key: VITE_ADMIN_PATH
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: VITE_GROQ_API_KEY
        sync: false

      - key: GOOGLE_MAPS_API_KEY
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: LOG_ENABLED
        value: "false"

      - key: LOG_LEVEL
        value: "error"

      - key: RENDER_EXTERNAL_URL
        sync: false
