services:
  - type: web
    name: lexicon-books-app
    runtime: node
    plan: standard
    buildCommand: npm run build
    startCommand: NODE_ENV=production npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_ENABLED
        value: 'false'
      - key: DATABASE_URL
        fromDatabase:
          name: lexicon-books-db
          property: connectionString
    autoDeploy: false
    
  - type: postgres
    name: lexicon-books-db
    ipAllowList: []
    plan: standard
    postgresVersion: 15
    databaseName: lexicon_books
