services:
  - type: web
    name: lexicon-books
    env: node
    region: oregon
    branch: main
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: DATABASE_URL
        group: DATABASE_URL
      - key: ADMIN_DATABASE_URL
        group: ADMIN_DATABASE_URL
      - key: JWT_SECRET
        group: JWT_SECRET
      - key: SESSION_SECRET
        group: SESSION_SECRET
      - key: ADMIN_EMAIL
        group: ADMIN_EMAIL
      - key: ADMIN_PIN
        group: ADMIN_PIN
      - key: ADMIN_SECRET_PATH
        group: ADMIN_SECRET_PATH
      - key: VITE_ADMIN_PATH
        group: VITE_ADMIN_PATH
      - key: GROQ_API_KEY
        group: GROQ_API_KEY
      - key: VITE_GROQ_API_KEY
        group: VITE_GROQ_API_KEY
      - key: GOOGLE_MAPS_API_KEY
        group: GOOGLE_MAPS_API_KEY
      - key: FRONTEND_URL
        group: FRONTEND_URL
      - key: LOG_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: error
      - key: RENDER_EXTERNAL_URL
        group: RENDER_EXTERNAL_URL
