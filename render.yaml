services:
  - type: web
    name: lexicon-books
    env: node
    region: oregon
    branch: main
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: "production"

      - key: PORT
        value: "5000"

      - key: DATABASE_URL
        sync: false

      - key: ADMIN_DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: SESSION_SECRET
        sync: false

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PIN
        sync: false

      - key: ADMIN_SECRET_PATH
        sync: false

      - key: VITE_ADMIN_PATH
        sync: false

      - key: GROQ_API_KEY
        sync: false

      - key: GOOGLE_MAPS_API_KEY
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_REDIRECT_URI
        sync: false

      - key: GOOGLE_REFRESH_TOKEN
        sync: false

      - key: GMAIL_SENDER
        sync: false

      - key: ORDER_NOTIFICATION_EMAIL
        sync: false

      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false

      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false

      - key: GOOGLE_SHEETS_ORDER_RANGE
        sync: false

      - key: GOOGLE_SHEETS_BOOK_RANGE
        sync: false

      - key: GOOGLE_SHEETS_USER_RANGE
        sync: false

      - key: PASSWORD_RESET_TTL_MINUTES
        value: "30"

      - key: PUBLIC_BASE_URL
        sync: false

      - key: FRONTEND_URL
        sync: false

      - key: LOG_ENABLED
        value: "false"

      - key: LOG_LEVEL
        value: "error"

      - key: RENDER_EXTERNAL_URL
        sync: false
